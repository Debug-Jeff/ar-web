        #Container-div {

            /* or any specific width */
            max-width: 1200px;
            /* optional: prevents container from getting too wide */

        .nav-link {
            position: relative;
            display: inline-block;
            text-decoration: none;
            transition: color 0.3s ease-in-out;
        }

        .nav-link::before {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: rgb(255, 255, 255);
            transform: scaleX(0);
            transform-origin: right;
            transition: transform 0.5s ease-in-out;
        }

        .nav-link:hover::before {
            transform: scaleX(1);
            transform-origin: left;
        }

        .nav-link:hover {
            color: rgb(9, 48, 244);
        }

        .nav-link.active {
            color: rgb(63, 63, 63);
        }
    </style>
</head>
